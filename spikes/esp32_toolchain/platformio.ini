; Throwaway: proves the ESP32-S3 toolchain (Arduino-ESP32 3.x via pioarduino) compiles the
; sim sketch with the pinned libraries. Platform URL pinned to a numbered release.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.5
    links2004/WebSockets@^2.6.1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
