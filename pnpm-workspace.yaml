packages:
  - apps/*
  - packages/*
# pnpm 11+ reads build approvals from allowBuilds (onlyBuiltDependencies was removed).
# Every dependency with an install script needs an entry, or `pnpm install` exits 1.
allowBuilds:
  esbuild: true
  '@napi-rs/canvas': true
  '@tailwindcss/oxide': true
  sharp: true
