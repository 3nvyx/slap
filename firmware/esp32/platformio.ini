; Slap device firmware (ESP32-S3 DevKitC-1, N16R8).
; Platform pinned to a numbered pioarduino release (Arduino-ESP32 3.3.x, which has ESP_I2S).
; The stock PlatformIO espressif32 platform ships core 2.0.x and has no ESP_I2S: do not swap it in.
;
;   pio run                      build the hardware firmware (env esp32s3)
;   pio run -t upload            flash over the UART/COM USB-C port
;   pio device monitor           serial log at 115200 (also accepts single-key commands, see README)
;   pio run -e wokwi             build for the Wokwi simulator (SSD1306 part, synthetic audio)

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Exact versions: these are the ones the toolchain spike and this firmware were compiled with.
lib_deps =
    olikraus/U8g2@2.36.18
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.2
; Serial = UART0 on the UART/COM USB-C port (not the native USB port).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
; Strict warnings for our own sources only (library warnings are not ours to fix).
build_src_flags =
    -Wall
    -Wextra

[env:esp32s3]

; Wokwi simulation: its only OLED part is an SSD1306 and it cannot simulate the I2S mic,
; so this env swaps the display constructor and replaces the mic with a synthetic signal.
; Pins are identical to firmware/wokwi/diagram.json (OLED 8/9, LED 2, button 0).
[env:wokwi]
build_flags =
    ${env.build_flags}
    -DOLED_SSD1306=1
    -DFAKE_AUDIO=1
